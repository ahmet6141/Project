[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fightercad"
version = "0.1.0"
description = "Parametric supersonic dogfight fighter aircraft design tool with CATIA integration"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
cad = ["pythonocc-core>=7.7.0"]
catia = ["pywin32>=306"]
dev = ["pytest>=7.0"]

[project.gui-scripts]
fightercad = "fightercad.app:main"

[tool.setuptools.packages.find]
where = ["src"]
