# FighterCAD - Default F-16 style cropped delta wing fighter configuration
# All dimensions in SI units (meters, degrees, m²)

meta:
  name: "F-16 Style Delta Fighter"
  design_mach: 1.6
  design_altitude_m: 10000.0

fuselage:
  length_m: 15.0
  max_diameter_m: 1.8
  nose_fineness_ratio: 3.5
  nose_profile: "haack"
  haack_C: 0.0
  aft_taper_ratio: 0.6
  cockpit_station_pct: 0.15
  cross_section: "elliptical"
  cross_section_aspect: 1.15

wing:
  planform: "cropped_delta"
  area_m2: 28.0
  aspect_ratio: 2.2
  taper_ratio: 0.10
  leading_edge_sweep_deg: 55.0
  trailing_edge_sweep_deg: -5.0
  dihedral_deg: -3.0
  twist_deg: -2.0
  root_airfoil: "biconvex_5"
  tip_airfoil: "biconvex_3"
  leading_edge_radius_mm: 1.5
  wing_station_pct: 0.45
  incidence_deg: 1.0

blending:
  root_fillet_radius_mm: 20.0
  leading_edge_fillet_mm: 10.0
  trailing_edge_fillet_mm: 10.0
  blending_mode: "smooth"
  strake_length_m: 0.0
  strake_sweep_deg: 70.0
  fairing_width_mm: 100.0
  stabilizer_root_fillet_mm: 30.0
  intake_fuselage_fillet_mm: 15.0

vertical_stabilizer:
  area_m2: 5.5
  aspect_ratio: 1.2
  sweep_deg: 50.0
  taper_ratio: 0.25
  cant_deg: 0.0

intake:
  intake_type: "side_mounted"
  capture_area_m2: 0.45
  ramp_angle_deg: 7.0
  lip_sweep_deg: 30.0
  station_pct: 0.30
  boundary_layer_diverter_mm: 80.0

exhaust:
  nozzle_type: "convergent_divergent"
  exit_diameter_m: 0.85
  throat_diameter_m: 0.65
  nozzle_length_m: 1.2

area_rule:
  enabled: true
  target_mach: 1.2
  waist_station_pct: 0.55
  smoothing_iterations: 5

internal_structure:
  engine_bay_station_pct: 0.55
  engine_bay_length_pct: 0.25
  fuel_tank_volume_pct: 0.30
  weapons_bay_enabled: false
