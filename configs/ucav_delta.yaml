# FighterCAD - Professional Delta-Wing UCAV Configuration
# Calibrated to nEUROn-class strike UCAV (9.5m length, 12.5m span)
#
# Reference aircraft:
#   nEUROn:  L=9.5m,  span=12.5m, MTOW=7000kg,  M=0.8,  Snecma M88
#   X-47B:   L=11.6m, span=18.9m, MTOW=20215kg, M=0.9+, F100-PW-220U
#   Taranis: L=12.4m, span=10m,   MTOW=8000kg,  M=0.9,  Adour Mk951
#   SACCON:  L=12.3m, span=15.2m, LE sweep=53°,  AR≈3.1
#
# Design features:
#   - BWB with smooth wing-body blend, no cockpit
#   - 53° LE sweep cranked delta (SACCON standard)
#   - Dorsal S-duct intake shielding engine face
#   - V-tail at 45° cant for combined pitch/yaw
#   - Saw-tooth TE aligned to LE sweep for RCS
#   - Reflex camber for tailless pitch trim (Cm0 > 0)

meta:
  name: "Delta-Wing UCAV"
  aircraft_type: "ucav"
  design_mach: 0.85          # high-subsonic cruise
  design_altitude_m: 12000.0 # ~40,000 ft ceiling

fuselage:
  length_m: 10.0             # nEUROn=9.5m, Taranis=12.4m
  max_diameter_m: 1.5        # ~15% of length
  nose_fineness_ratio: 2.8   # blunter nose for stealth chine shaping
  nose_profile: "ogive"      # tangent ogive: smooth low-RCS curvature
  haack_C: 0.0
  aft_taper_ratio: 0.35      # aggressive narrowing for nozzle integration
  cockpit_station_pct: 0.12  # avionics bay (no cockpit)
  cross_section: "elliptical"
  cross_section_aspect: 1.35 # wide-flat BWB body
  cylindrical_end_pct: 0.55  # short cylindrical, long blend to tail
  aft_taper_power: 2.0       # quadratic taper
  nose_body_blend_pct: 0.08  # wide blend zone for BWB nose merge
  tail_closure_radius_pct: 0.25
  cross_section_aspect_nose: 1.15
  cross_section_aspect_tail: 1.6  # very flat tail (platypus exhaust)
  canopy_enabled: false
  canopy_height_mm: 0.0
  canopy_length_pct: 0.0
  dorsal_spine_height_mm: 0.0

wing:
  planform: "cropped_delta"
  span_m: 12.5               # nEUROn=12.5m, L/span≈0.80
  area_m2: 48.0              # wing loading ~145 kg/m² at MTOW 7000kg
  aspect_ratio: 3.25         # span²/area = 156.25/48 ≈ 3.25 (SACCON≈3.1)
  taper_ratio: 0.08          # near-pointed tips
  leading_edge_sweep_deg: 53.0  # SACCON standard, nEUROn ~55°
  trailing_edge_sweep_deg: 20.0 # planform-aligned edges
  dihedral_deg: -1.5         # slight anhedral
  twist_deg: -4.0            # washout for tailless pitch trim
  root_airfoil: "naca64a004"
  tip_airfoil: "biconvex_3"
  leading_edge_radius_mm: 4.0   # rounder for subsonic efficiency
  wing_station_pct: 0.30     # forward wing root (BWB)
  incidence_deg: 2.5         # cruise incidence
  thickness_to_chord_root: 0.14 # 14% root t/c (BWB centerbody volume)
  thickness_to_chord_tip: 0.09  # 9% tip (wave drag minimum)
  camber_root_pct: 2.0       # reflex camber for Cm0>0
  camber_tip_pct: -0.5       # negative at tip for pitch trim
  te_thickness_mm: 1.5       # blunt TE (~0.5-1% chord)
  sawtooth_te_enabled: true
  sawtooth_depth_mm: 50.0    # ~1.5× X-band wavelength
  sawtooth_count: 14         # aligned with LE sweep
  inner_panel_span_pct: 0.28 # crank at 28% (SACCON: 29%)
  inner_panel_sweep_deg: 58.0 # steeper inboard panel

control_surfaces:
  elevon_chord_pct: 0.25     # 25% chord elevons
  aileron_chord_pct: 0.20    # 20% chord ailerons
  elevon_span_pct: 0.65      # 65% of inner panel
  aileron_span_pct: 0.45     # 45% of outer panel
  deflection_deg: 0.0

blending:
  root_fillet_radius_mm: 120.0  # very large BWB blend
  leading_edge_fillet_mm: 40.0
  trailing_edge_fillet_mm: 25.0
  blending_mode: "smooth"
  strake_length_m: 0.8       # short LEX blended into forebody chine
  strake_sweep_deg: 68.0
  fairing_width_mm: 300.0    # 300mm BWB blend zone
  stabilizer_root_fillet_mm: 25.0
  intake_fuselage_fillet_mm: 30.0

vertical_stabilizer:
  area_m2: 1.8               # ~3.75% of wing area per fin
  aspect_ratio: 1.1          # low AR (stubby for RCS)
  sweep_deg: 50.0            # aligned with wing LE ±3°
  taper_ratio: 0.35
  cant_deg: 0.0
  v_tail: true
  v_tail_cant_deg: 45.0      # 45° from vertical (B-2/YF-23 range)
  tailless: false

intake:
  intake_type: "dorsal"      # top-mounted S-duct
  intake_count: 1
  capture_area_m2: 0.32      # sized for ~50kN engine (M88/Adour)
  ramp_angle_deg: 4.0        # gentle for subsonic
  lip_sweep_deg: 40.0        # aligned to planform edges
  station_pct: 0.22          # 22% of fuselage
  boundary_layer_diverter_mm: 50.0
  capture_aspect_ratio: 2.5  # very wide, flat dorsal
  duct_length_m: 2.8         # S-duct for 60-90° turn
  lip_radius_mm: 25.0        # generous for subsonic

exhaust:
  nozzle_type: "convergent"  # subsonic: simple convergent
  exit_diameter_m: 0.55      # sized for M88-class engine
  throat_diameter_m: 0.50
  nozzle_length_m: 1.0       # short, shielded by aft fuselage

area_rule:
  enabled: true
  target_mach: 0.85          # cruise Mach optimization
  waist_station_pct: 0.48
  smoothing_iterations: 10

internal_structure:
  engine_bay_station_pct: 0.52
  engine_bay_length_pct: 0.22
  fuel_tank_volume_pct: 0.30
  weapons_bay_enabled: true
