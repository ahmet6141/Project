# FighterCAD - Professional Delta-Wing UCAV Configuration
#
# Calibrated to nEUROn-class strike UCAV with research-backed values from:
#   nEUROn:  L=9.5m,  span=12.5m, MTOW=7000kg,  M=0.8   (Snecma M88)
#   X-47B:   L=11.6m, span=18.9m, MTOW=20215kg, M=0.9+  (F100-PW-220U)
#   Taranis: L=11.35m, span=9.94m, MTOW=8000kg, M=0.9   (Adour Mk951)
#   SACCON:  L=12.3m, span=15.2m, LE sweep=53deg, AR=3.1 (AVT-161)
#
# Sources: Crowell 1996 (nose), SACCON AVT-161/AVT-251 (planform),
#   Virginia Tech X-47B analysis, B-2 stealth shaping, Hepperle airfoil data

meta:
  name: "Delta-Wing UCAV"
  aircraft_type: "ucav"
  design_mach: 0.85
  design_altitude_m: 12000.0

fuselage:
  length_m: 10.0               # nEUROn=9.5, X-47B=11.6, Taranis=11.35
  max_diameter_m: 1.2          # body height; width=aspect*height=2.4m
  nose_fineness_ratio: 3.5     # 3.0-4.0 range (Crowell 1996)
  nose_profile: "haack"        # Von Karman (C=0): min wave drag, smooth
  haack_C: 0.0                 # C=0: LD-Haack, smoothest for stealth
  aft_taper_ratio: 0.35        # narrows to 35% at nozzle
  cockpit_station_pct: 0.12    # avionics bay (no cockpit)
  cross_section: "bwb_flat_top"    # flat upper + rounded lower (BWB style)
  cross_section_aspect: 2.0    # W:H=2:1 flattened (B-2/X-47B style)
  cylindrical_end_pct: 0.45    # no true cylinder on BWB; max area 40-45%
  aft_taper_power: 3.0         # cubic: smooth 2nd derivative for area rule
  nose_body_blend_pct: 0.08    # wide blend for BWB nose merge
  tail_closure_radius_pct: 0.30
  cross_section_aspect_nose: 1.5  # pointed nose to wide-flat transition
  cross_section_aspect_tail: 2.5  # very flat (platypus slot exhaust)
  canopy_enabled: false
  canopy_height_mm: 0.0
  canopy_length_pct: 0.0
  dorsal_spine_height_mm: 0.0
  body_wing_blend_ratio: 0.0   # BWB blend handled by fairing, not fuselage widening
  body_wing_inner_span_m: 0.0  # auto-compute from wing inner panel

wing:
  planform: "cropped_delta"
  span_m: 12.5               # nEUROn=12.5m, L/span=0.80
  area_m2: 48.0              # wing loading ~145 kg/m2 (nEUROn~140)
  aspect_ratio: 3.25         # span2/area=3.25 (SACCON=3.1)
  taper_ratio: 0.08          # near-pointed tips (0.08-0.15)
  leading_edge_sweep_deg: 53.0  # SACCON AVT-161 standard
  trailing_edge_sweep_deg: 27.0 # planform alignment (MULDICON 26-30)
  dihedral_deg: 0.0          # 0 geometric (53 sweep = ~5 effective)
  twist_deg: -4.0            # 3-5 washout for tailless trim
  root_airfoil: "supercritical_14"  # BWB: flat-top supercritical
  tip_airfoil: "biconvex_3"         # thin supersonic tip
  leading_edge_radius_mm: 5.0   # 0.2-0.5% chord; moderate stealth/stall
  wing_station_pct: 0.25     # BWB: root LE near nose
  incidence_deg: 1.5         # 0-2 for BWB
  thickness_to_chord_root: 0.14  # 14% (BWB centerbody; 12-16%)
  thickness_to_chord_tip: 0.07   # 7% (research: 6-8%)
  camber_root_pct: 2.0       # reflex for Cm0>0
  camber_tip_pct: -1.0       # negative reflex for positive Cm0
  te_thickness_mm: 1.5       # blunt TE 0.5-1% chord
  sawtooth_te_enabled: true
  sawtooth_depth_mm: 50.0    # ~1.7x X-band wavelength
  sawtooth_count: 14
  inner_panel_span_pct: 0.29 # SACCON: 29% semi-span
  inner_panel_sweep_deg: 53.0 # constant single LE angle (SACCON)
  outer_panel_sweep_deg: 45.0 # cranked: outer panel less sweep

control_surfaces:
  elevon_chord_pct: 0.25     # 20-25% chord
  aileron_chord_pct: 0.22
  elevon_span_pct: 0.65      # 50-70% inner panel TE
  aileron_span_pct: 0.65     # 60-80% outer panel TE
  deflection_deg: 0.0

blending:
  root_fillet_radius_mm: 80.0   # moderate fillet
  leading_edge_fillet_mm: 40.0
  trailing_edge_fillet_mm: 25.0
  blending_mode: "smooth"
  strake_length_m: 0.6
  strake_sweep_deg: 65.0
  fairing_width_mm: 250.0    # 250mm blend zone
  stabilizer_root_fillet_mm: 30.0
  intake_fuselage_fillet_mm: 35.0

vertical_stabilizer:
  area_m2: 4.5               # ~9.4% wing area per fin (8-12%)
  aspect_ratio: 1.2          # low AR for stealth (1.0-1.5)
  sweep_deg: 53.0            # match wing LE sweep
  taper_ratio: 0.40          # 0.3-0.5
  cant_deg: 0.0
  v_tail: true
  v_tail_cant_deg: 45.0      # 45 from vertical
  tailless: false

intake:
  intake_type: "dorsal"      # top-mounted S-duct
  intake_count: 1
  capture_area_m2: 0.25      # 0.20-0.30 for Adour/F124
  ramp_angle_deg: 5.0
  lip_sweep_deg: 53.0        # aligned to LE sweep
  station_pct: 0.20          # 15-25% of length
  boundary_layer_diverter_mm: 20.0  # 10-30mm subsonic BL
  capture_aspect_ratio: 3.5  # 3:1-5:1 (wide, flat dorsal)
  duct_length_m: 2.8         # S-duct L/D~5-6
  lip_radius_mm: 25.0

exhaust:
  nozzle_type: "convergent"
  nozzle_shape: "slot"       # stealth: flat slot nozzle
  slot_aspect_ratio: 8.0     # W:H = 8:1 for low IR/RCS
  exit_diameter_m: 0.55
  throat_diameter_m: 0.50
  nozzle_length_m: 1.2       # serpentine for LOS blockage

area_rule:
  enabled: true
  target_mach: 0.85
  waist_station_pct: 0.40    # max area at 35-45%
  smoothing_iterations: 12

internal_structure:
  engine_bay_station_pct: 0.55
  engine_bay_length_pct: 0.22
  fuel_tank_volume_pct: 0.30
  weapons_bay_enabled: true
